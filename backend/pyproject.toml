[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forecaster"
version = "0.1.0"
description = "Leakage-free walk-forward stock forecasting platform"
readme = "../README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rohit" }]

# Core: everything needed for data + validation + CLI. Deliberately light so
# `pip install -e .` is fast and CI stays quick. Heavy ML lives in extras.
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "greenlet>=3.0",
    "structlog>=24.1",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "pyarrow>=16.0",
    "duckdb>=1.0",
    "httpx>=0.27",
    "tenacity>=8.3",
    "typer>=0.12",
    "rich>=13.7",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
# Data providers
data = [
    "yfinance>=0.2.40",
    "pandas-market-calendars>=4.4",
    "lxml>=5.2",
]
# Classical + gradient-boosted models
ml = [
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "lightgbm>=4.3",
    "xgboost>=2.0",
    "catboost>=1.2",
    "shap>=0.45",
    "optuna>=3.6",
]
# Sequence models (heavy; optional so CI can skip)
deep = [
    "tensorflow>=2.17; python_version < '3.14'",
]
# API service
api = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.1",
    "redis>=5.0",
    "slowapi>=0.1.9",
    "apscheduler>=3.10",
    "websockets>=12.0",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-python-dateutil",
    "pandas-stubs",
]

[project.scripts]
forecaster = "forecaster.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
forecaster = ["py.typed"]

# ─────────────────────────── ruff ───────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "C4",        # comprehensions
    "SIM",       # simplify
    "TID",       # tidy imports
    "PTH",       # use pathlib
    "RUF",
    "ANN",       # type annotations
    "T20",       # no print()  <- the old code violated this everywhere
    "BLE",       # no bare except <- and this
]
ignore = [
    "ANN401",    # Any is sometimes correct
    "B008",      # FastAPI Depends() in defaults is idiomatic
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S101"]
"alembic/**" = ["ANN", "E501", "I001"]

[tool.ruff.lint.isort]
known-first-party = ["forecaster"]

# ─────────────────────────── mypy ───────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["forecaster"]

[[tool.mypy.overrides]]
module = [
    "yfinance.*", "duckdb.*", "lightgbm.*", "xgboost.*", "catboost.*",
    "statsmodels.*", "shap.*", "optuna.*", "tensorflow.*", "keras.*",
    "sklearn.*", "pandas_market_calendars.*", "apscheduler.*",
]
ignore_missing_imports = true

# ─────────────────────────── pytest ─────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers --strict-config"
markers = [
    "slow: deselect with -m 'not slow'",
    "network: requires live network access",
    "leakage: lookahead-bias guard tests",
    "deep: requires the [deep] extra (tensorflow)",
]
filterwarnings = ["error::DeprecationWarning:forecaster.*"]

[tool.coverage.run]
source = ["src/forecaster"]
omit = ["*/cli.py", "*/jobs/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
