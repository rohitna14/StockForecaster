[alembic]
script_location = alembic
prepend_sys_path = src
version_path_separator = os
# sqlalchemy.url is set programmatically in alembic/env.py from FORECASTER_DATABASE_URL

# Post-write hooks intentionally omitted: they resolve executables from PATH,
# which fails when ruff lives in the project venv. Run `make fmt` instead.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
